Options Protocol Scanneron:Run automatically on a schedule (Cron syntax)This example runs at minute 0 past every hour from 13 through 20 on Monday to Friday.Adjust this to match your preferred market hours (in UTC)schedule:- cron: '0 13-20 * * 1-5'Allow manual triggering from the GitHub Actions tabworkflow_dispatch:STREAMING_CHUNK:Defining the execution jobjobs:scan-market:runs-on: ubuntu-lateststeps:
  # Step 1: Check out your repository code
  - name: Checkout repository
    uses: actions/checkout@v3

  # Step 2: Set up Python environment
  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  # Step 3: Install necessary Python packages
  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests yfinance pandas

  # Step 4: Run the Python scanner script
  - name: Run Scanner Bot
    env:
      # Pulls your secure webhook URL from GitHub Secrets
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    run: python scanner.py
